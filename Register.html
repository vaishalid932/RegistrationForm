<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table align="center">
        <form action="" method="post">
            <tr>
                <td>
                    <label for="firstname">First Name :</label>
                </td>
                <td>
                  <input type="text" name="fname" id="firstname"> 
                </td>

            </tr>

          

            <tr>
                <td>
                    <label for="lastname">Last Name :</label>
                </td>
                <td>
                    <input type="text" name="lname" id="lastname">
                </td>
            </tr>

            

            <tr>
                <td>
                <label for="email">Email :</label>
                </td>
                <td>
                    <input type="text" name="email" id="email">
                </td>
            </tr>
            
           

            <tr>
                <td>
                    <label for="pass">Password :</label>
                </td>
                <td>
                    <input type="password" name="password" id="pass">
                </td>
            </tr>
            
           

            <tr>
                <td>
                    <label for="gender">Gender :</label>
                </td>
                <td>
                    <input type="radio" name="gen" id="gender">Male
                    <input type="radio" name="gen" id="gender">Female
                </td>
            </tr>
            
            

            <tr>
                <td>
                    <label for="skills">Skills</label>
                </td>
                <td>
                    <input type="checkbox" name="skill" id="skills">C#
                    <input type="checkbox" name="skill" id="skills">ADO.NET
                    <input type="checkbox" name="skill" id="skills">SQL
                    <input type="checkbox" name="skill" id="skills">ASP.NET CORE
                    <input type="checkbox" name="skill" id="skills">ANGULAR
                        
                    
                </td>
            </tr>
            
            

            <tr>
                <td>City</td>
                <td>
                    <select name="" id="">
                        <option value="">Select City</option>
                        <option value="Pune">Pune</option>
                        <option value="Kolhapur">Kolhapur</option>
                        <option value="Mumbai">Mumbai</option>
                        <option value="Satara">Satara</option>
                    </select>

                </td>
            </tr>

          

            <tr>
                <td>Upload your Aadhar</td>
                <td>
                    <input type="file" name="" id="">
                </td>
            </tr>


            <tr>
                <td>

                </td>
                <td>
                    <input type="submit" value="Sign Up">
                </td>
            </tr>
           
        </form>

    </table>
</body>
</html>
